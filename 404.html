<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Man Luo, FGA</title>
  <meta name="description" content="The page you asked for is not here. Return to Man Luo, FGA — period jewelry, fine gemstones, and contemporary design in New York City.">
  <meta name="theme-color" content="#fcfbf8">
  <meta name="robots" content="noindex">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/HedvigLettersSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/PTSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .notfound {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: calc(var(--header-h) + 3vh) var(--gutter) 4rem;
      text-align: center;
      background:
        radial-gradient(120% 90% at 50% 6%, #ffffff 0%, rgba(255, 255, 255, 0) 58%),
        linear-gradient(180deg, #fdfcf9 0%, var(--paper) 62%, #f9f8f4 100%);
    }
    .notfound__code {
      font-family: var(--display);
      font-size: clamp(3.2rem, 11vw, 6rem);
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .notfound__rule {
      width: 1px;
      height: clamp(40px, 8vh, 80px);
      background: var(--line);
      margin: clamp(1.6rem, 4vh, 2.4rem) 0;
    }
    .notfound__title {
      font-family: var(--display);
      font-size: clamp(1.15rem, 4.4vw, 1.6rem);
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .notfound__text {
      margin-top: 0.9rem;
      max-width: 34ch;
      font-size: 0.86rem;
      line-height: 1.7;
      color: var(--ink-soft);
    }
    .notfound__back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: clamp(1.8rem, 5vh, 2.6rem);
      padding: 0 1.9rem;
      border: 1px solid rgba(20, 18, 15, 0.42);
      border-radius: 7px;
      background: rgba(246, 244, 238, 0.9);
      box-shadow: 0 8px 18px -12px rgba(20, 18, 15, 0.45);
      font-family: var(--display);
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      text-transform: none;
      transition: background-color 0.4s var(--ease), color 0.4s var(--ease),
                  border-color 0.4s var(--ease), transform 0.4s var(--ease),
                  box-shadow 0.4s var(--ease);
    }
    .notfound__back:hover,
    .notfound__back:focus-visible {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
      transform: translateY(-2px);
      box-shadow: 0 14px 26px -18px rgba(20, 18, 15, 0.6);
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header is-solid" id="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/" aria-label="Man Luo — back to home">Man Luo</a>
    </div>
  </header>

  <main class="notfound" id="main">
    <p class="notfound__code">404</p>
    <div class="notfound__rule" aria-hidden="true"></div>
    <h1 class="notfound__title">This page is not here</h1>
    <p class="notfound__text">The address may have changed, or it may never have existed. The work is all on the front page.</p>
    <a class="notfound__back" href="/">Return home</a>
  </main>
</body>
</html>
